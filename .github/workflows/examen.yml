name: examen-campito
on:
  push:
    branches: [campito]
  workflow_dispatch:
jobs:
  examinar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Examen esbuild (juez Cloudflare)
        run: npx --yes esbuild worker.js --bundle --outfile=/tmp/ares-out.js
      - name: Examen de Ares
        run: python examen.py
